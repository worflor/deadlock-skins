# The store's one pipe: check everything that needs no game, build the site and catalog from the manifests, and
# deploy exactly that tree, only from main and only when the check passed. CONTRIBUTING.md has the whole flow.
name: store

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MAGICIAN_THREADS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Pillow, hash-pinned
        run: python -m pip install --require-hashes --only-binary ":all:" -r tools/requirements.txt
      - name: Release zips already checked once (each is verified again by sha256)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/assets
          key: assets-${{ hashFiles('skins/*/manifest.json') }}
          restore-keys: assets-
      - name: The pinned Magician (checked against magician.lock.json when it is downloaded)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/magician
          key: magician-${{ hashFiles('magician.lock.json') }}
      - name: Tests
        run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: Check, and build the tree
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRIVACY_WALL: ${{ secrets.PRIVACY_WALL }}
        run: >-
          python tools/store.py check --site _site --event "$GITHUB_EVENT_PATH"
          --previous https://woflo.dev/deadlock-skins/
      - name: Hand the checked tree to the deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true  # .dmm-source-files: what smoke and the next check read back

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://woflo.dev/deadlock-skins/
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Every served path answers, every zip is the manifest's bytes
        run: python tools/store.py smoke --tries 6
