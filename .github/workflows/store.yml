# The store's one pipe: check everything that needs no game, build the site and catalog from the manifests, and
# deploy exactly that tree, only from main and only when the check passed. CONTRIBUTING.md has the whole flow.
name: store

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MAGICIAN_THREADS: "2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Pillow, hash-pinned
        run: python -m pip install --require-hashes --only-binary :all: -r tools/requirements.txt
      - name: Release zips already checked once (each is verified again by sha256)
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/assets
          key: assets-${{ hashFiles('skins/*/manifest.json') }}
          restore-keys: assets-
      - name: The pinned Magician (verified against magician.lock.json on every unpack)
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/magician
          key: magician-${{ hashFiles('magician.lock.json') }}
      - name: Tests
        run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: Check, and build the tree
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRIVACY_WALL: ${{ secrets.PRIVACY_WALL }}
        run: >-
          python tools/store.py check --site _site --event "$GITHUB_EVENT_PATH"
          --previous https://woflo.dev/deadlock-skins/
      - name: Hand the checked tree to the deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://woflo.dev/deadlock-skins/
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  smoke:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Every served path answers, every zip is the manifest's bytes
        run: python tools/store.py smoke --tries 6
